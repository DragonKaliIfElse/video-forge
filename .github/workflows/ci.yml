name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  remotion:
    name: Remotion (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src

  python:
    name: Python (sintaxe + doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checar sintaxe dos scripts
        run: |
          python -m compileall -q skills/video-anim-recipes/scripts
      - name: Verificar CLI do forge
        run: |
          python skills/video-anim-recipes/scripts/forge.py steps
